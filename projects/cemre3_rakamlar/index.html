<!doctype html>
<html lang="tr" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/fonts.css" />
<script src="assets/gsap.min.js"></script>
<script src="assets/timing.js"></script>
<script src="assets/map.js"></script>
<style>
:root{
  --night:#0B1530; --orange:#EC6612; --amber:#F8AC1D; --cream:#FBF7EE;
  --brand:linear-gradient(100deg,#1A58B3,#941D8A 45%,#D44B8C 70%,#F68F19);
  --brandbg:linear-gradient(160deg,#193D71 0%,#317ABC 18%,#631776 40%,#A6269C 58%,#D44B8C 74%,#E87819 90%,#FE9F0B 100%);
  --m:68px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.clip{position:absolute;inset:0}
.scene > *{position:absolute}
video.clip{width:1080px;height:1920px;object-fit:cover}
.bgimg{left:-33px;top:-58px;width:1146px;height:2036px;object-fit:cover}
.shade{inset:0;background:linear-gradient(180deg,rgba(11,21,48,.55) 0%,transparent 22%,transparent 42%,rgba(11,21,48,.86) 70%,var(--night) 96%)}
.shade.top{background:linear-gradient(180deg,rgba(11,21,48,.85) 0%,rgba(11,21,48,.5) 28%,transparent 48%,transparent 72%,rgba(11,21,48,.6) 100%)}
.pill{display:inline-flex;align-items:center;gap:16px;background:rgba(11,21,48,.72);border:2px solid rgba(248,172,29,.55);border-radius:999px;padding:14px 26px 14px 22px;font:700 34px/1 Inter;white-space:nowrap}
.pill .dot{width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 7px rgba(248,172,29,.25)}
.city{left:var(--m);bottom:380px}
.cityTop{right:var(--m);top:180px}
.kicker{display:inline-block;font:800 30px/1 Inter;letter-spacing:.08em;background:var(--amber);color:var(--night);padding:10px 16px 9px;border-radius:4px}
.big{font:400 300px/.9 Anton;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 6px 26px rgba(0,0,0,.45)}
.cap{font:800 40px/1.1 Inter;letter-spacing:.06em}
.src{font:700 26px/1.2 Inter;opacity:.78;letter-spacing:.02em}
.hl{display:block;font:400 150px/1 Anton;text-shadow:0 6px 26px rgba(0,0,0,.55)}
.sticker{display:inline-block;background:#fff;color:var(--night);font:400 150px/1 Anton;padding:14px 34px 8px;border-radius:14px;box-shadow:0 18px 34px -12px rgba(0,0,0,.7)}
.print{background:var(--cream);padding:16px;box-shadow:0 18px 34px -12px rgba(0,0,0,.7),0 3px 6px rgba(0,0,0,.25)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;top:-22px;left:50%;width:150px;height:44px;margin-left:-75px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.stamp{font:400 150px/1 Anton;color:var(--amber);border:9px solid var(--amber);padding:16px 40px 6px;text-shadow:0 6px 26px rgba(0,0,0,.4)}
.pills{display:flex;flex-wrap:wrap;gap:12px;max-width:944px}
.pills .pill{font-size:28px;padding:11px 20px}
#logo{position:absolute;top:64px;right:var(--m);width:136px;height:64px;background:url(assets/logo_white.png) center/contain no-repeat;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));z-index:300}
#prog{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(255,255,255,.15);z-index:300}
#prog i{display:block;height:100%;width:100%;background:var(--brand);transform-origin:left center;transform:scaleX(0)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%);z-index:290;pointer-events:none}
#grain{position:absolute;left:-150px;top:-150px;width:1380px;height:2220px;opacity:.26;mix-blend-mode:overlay;z-index:295;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920"></div>
<script>
/* Build the DOM from timing.js so every element's time comes from tools/timing.py */
const TR = s => s.replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase();
const nf = n => Math.round(n).toLocaleString('tr-TR');
const OV = 0.25;                         // each scene outlives its cut by 0.25 s
const dur = s => T.scenes.find(x => x.id === s).beats * T.beat;
const root = document.getElementById('root');
const html = [];
const scene = (id, inner) => html.push(`<div id="${id}" class="clip scene" data-start="${B(id)}" data-duration="${(dur(id) + OV).toFixed(3)}">${inner}</div>`);
const video = (id, src, t0, t1, z) => html.push(`<video id="${id}" class="clip" src="assets/vid/${src}" muted playsinline preload="auto" data-start="${t0}" data-duration="${(t1 - t0).toFixed(3)}" style="z-index:${z}"></video>`);
const img = (n) => `assets/img/${n}.jpg`;
const pill = (txt, cls, z, id='') => `<div ${id?`id="${id}"`:''} class="pill ${cls}" style="z-index:${z}"><span class="dot"></span>${txt}</div>`;

/* ---- s1 hook ---- */
scene('s1', `<img id="s1bg" class="bgimg" src="${img('Kastamonu4')}" style="z-index:11">
  <div class="shade top" style="z-index:14"></div>
  <div style="left:var(--m);right:var(--m);top:420px;text-align:center;z-index:16"><span id="s1a" class="hl">${TR('Ekimde')}</span><span id="s1b" class="sticker" style="margin-top:18px">${TR('9 il.')}</span></div>
  ${pill('Kastamonu','city',16,'s1p1')}${pill('İzmir · Ödemiş','city',16,'s1p2')}`);
video('v1', 's1_izmir.mp4', B('s1',4), B('s1',8) + OV, 12);

/* ---- s2 map ---- */
const M = window.MAP, c = M.cities;
const K = ['Düzce','Kastamonu','Trabzon','Gümüşhane','Rize'], E = ['İzmir','Manisa','Uşak','Akşehir'];
const LBL = {'Akşehir':'Konya'};
const arc = (a,b) => { const [x1,y1]=c[a],[x2,y2]=c[b]; const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1; return `Q${(mx-dy*.22).toFixed(1)},${(my+dx*.22).toFixed(1)} ${x2},${y2}`; };
const route = L => `M${c[L[0]]}` + L.slice(1).map((n,i)=>arc(L[i],n)).join('');
const off = {Düzce:[-14,-14,'end'],Kastamonu:[0,-18,'middle'],Trabzon:[-12,-14,'end'],Gümüşhane:[0,34,'middle'],Rize:[0,-18,'middle'],'İzmir':[0,34,'middle'],Manisa:[0,-18,'middle'],'Uşak':[0,-18,'middle'],'Akşehir':[0,34,'middle']};
const pin = (n,col,i) => `<g class="pin" id="pin${i}" style="transform-origin:${c[n][0]}px ${c[n][1]}px"><circle cx="${c[n][0]}" cy="${c[n][1]}" r="14" fill="${col}" opacity=".3"/><circle cx="${c[n][0]}" cy="${c[n][1]}" r="7" fill="#fff" stroke="${col}" stroke-width="3"/>
  <text x="${c[n][0]+off[n][0]}" y="${c[n][1]+off[n][1]}" text-anchor="${off[n][2]||'start'}" font-family="Inter" font-weight="800" font-size="20" fill="#fff" stroke="#6b1c7d" stroke-width="5" paint-order="stroke">${LBL[n]||n}</text></g>`;
scene('s2', `<div style="inset:0;background:var(--brandbg);z-index:21"></div>
  <div id="s2t" style="left:var(--m);top:250px;z-index:26"><div style="font:400 150px/.98 Anton">${TR('9 il,')}<br><span id="s2k" style="display:inline-block;margin-top:18px;background:#fff;color:#631776;padding:10px 22px 4px;border-radius:12px">${TR('2 kol.')}</span></div></div>
  <div id="s2map" style="left:0;top:640px;width:1080px;height:702px;overflow:hidden;z-index:25;-webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 60%,transparent 100%)">
   <svg viewBox="10 -40 830 540" width="1080" height="702" style="display:block">
    <path d="${M.others}" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
    <path d="${M.turkey}" fill="rgba(255,255,255,.92)" stroke="#fff" stroke-width="1.2"/>
    <path id="rK" d="${route(K)}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#0B1530" stroke-width="5" stroke-linecap="round"/>
    <path id="rE" d="${route(E)}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#F8AC1D" stroke-width="5" stroke-linecap="round"/>
    ${K.map((n,i)=>pin(n,'#0B1530',i)).join('')}${E.map((n,i)=>pin(n,'#F8AC1D',5+i)).join('')}
   </svg></div>
  <div id="s2leg" style="left:var(--m);top:1360px;display:flex;flex-direction:column;gap:14px;z-index:26">
   <div style="font:800 34px/1 Inter;display:flex;align-items:center;gap:14px"><i style="width:44px;height:6px;background:#0B1530;display:block;border-radius:3px"></i>Karadeniz</div>
   <div style="font:800 34px/1 Inter;display:flex;align-items:center;gap:14px"><i style="width:44px;height:6px;background:var(--amber);display:block;border-radius:3px"></i>Ege</div></div>`);

/* ---- s3 counter ---- */
scene('s3', `<img id="s3bg" class="bgimg" src="${img('Trabzon3')}" style="z-index:31">
  <div class="shade" style="z-index:34"></div>
  <div id="s3b" style="left:var(--m);bottom:420px;z-index:36"><span class="kicker">${TR('rakamlarla cemre')}</span>
   <div id="n3" class="big" style="margin-top:16px">0</div><div class="cap">${TR('öğrenciye ulaştık')}</div>
   <div class="src" style="margin-top:18px">18 okul · 9 il · Ekim 2026</div></div>
  ${pill('Trabzon','cityTop',36,'s3p')}`);

/* ---- s4 Karadeniz ---- */
const KR = ['Düzce','Kastamonu','Trabzon','Gümüşhane','Rize'];
const ER = ['İzmir · Ödemiş','Manisa','Uşak','Konya'];
const armBlock = (id, color, label, list) => `<div id="${id}b" style="left:var(--m);bottom:400px;z-index:46">
   <span class="kicker" style="${color}">${TR(label)}</span>
   <div id="${id}n" class="big" style="font-size:250px;margin-top:12px">0</div><div class="cap" style="font-size:34px">${TR('öğrenci')}</div>
   <div class="pills" style="margin-top:22px">${list.map(n=>`<span class="pill ${id}pl">${n}</span>`).join('')}</div></div>`;
scene('s4', `<img id="s4bg2" class="bgimg" src="${img('Duzce15')}" style="z-index:43">
  <div class="shade" style="z-index:44"></div>
  <div id="s4p1" class="print" style="left:120px;top:250px;width:520px;height:420px;z-index:45"><div class="tape"></div><img src="${img('Rize7')}"></div>
  <div id="s4p2" class="print" style="left:470px;top:500px;width:480px;height:384px;z-index:45"><div class="tape"></div><img src="${img('Duzce17')}"></div>
  ${armBlock('s4','background:var(--orange);color:#fff','karadeniz kolu',KR)}
  ${pill('Gümüşhane','cityTop',46,'s4c1')}
  <div id="s4tir" style="left:var(--m);top:200px;z-index:46"><span class="kicker" style="background:#fff">${TR('yeğitek bilim tırı')}</span><div style="font:800 40px/1.2 Inter;margin-top:16px;text-shadow:0 4px 16px rgba(0,0,0,.6)">Kastamonu · Düzce</div></div>`);
video('v4', 's4_gumushane.mp4', B('s4',0), B('s4',5) + OV, 42);

/* ---- s5 Ege ---- */
scene('s5', `<img id="s5bg2" class="bgimg" src="${img('Usak5')}" style="z-index:53">
  <div class="shade" style="z-index:54"></div>
  <div id="s5p1" class="print" style="left:440px;top:250px;width:520px;height:416px;z-index:55"><div class="tape"></div><img src="${img('Izmir_Odemis1')}"></div>
  <div id="s5p2" class="print" style="left:110px;top:520px;width:480px;height:384px;z-index:55"><div class="tape"></div><img src="${img('Manisa1')}"></div>
  ${armBlock('s5','','ege kolu',ER)}
  ${pill('Konya','cityTop',56,'s5c1')}${pill('Uşak','cityTop',56,'s5c2')}`);
video('v5', 's5_konya.mp4', B('s5',0), B('s5',5) + OV, 52);

/* ---- s6 robot futbolu ---- */
scene('s6', `<img id="s6bg" class="bgimg" src="${img('Usak16')}" style="z-index:61">
  <div class="shade" style="z-index:64"></div>
  <div id="s6t" style="left:var(--m);bottom:430px;z-index:66"><div id="s6a" style="font:400 130px/1 Anton;text-shadow:0 6px 26px rgba(0,0,0,.55)">${TR('robot futbolu')}</div>
   <div style="margin-top:14px"><span id="s6b" style="display:inline-block;background:var(--brand);font:400 130px/1 Anton;padding:10px 28px 2px;border-radius:10px">${TR('sahada!')}</span></div></div>
  ${pill('Uşak','cityTop',66,'s6c1')}${pill('İzmir · Ödemiş','cityTop',66,'s6c2')}`);
video('v6', 's6_izmir.mp4', B('s6',6), B('s6',12) + OV, 62);

/* ---- s7 peak ---- */
scene('s7', `<div class="shade" style="z-index:74;opacity:.75"></div>
  <div style="left:0;right:0;top:760px;display:flex;justify-content:center;z-index:76"><div id="s7s" class="stamp">${TR('evet!')}</div></div>
  ${pill('Düzce','city',76,'s7c')}`);
video('v7', 's7_duzce.mp4', B('s7',0), B('s7',8) + OV, 72);

/* ---- s8 closing ---- */
scene('s8', `<img id="s8bg" class="bgimg" src="${img('Aksehir9')}" style="z-index:81">
  <div class="shade" style="z-index:84"></div>
  <div style="left:var(--m);right:var(--m);bottom:560px;text-align:center;z-index:86">
   <div id="s8a" style="font:400 110px/1 Anton;text-shadow:0 6px 26px rgba(0,0,0,.55)">${TR('kağıt üzerinde')}<br>${TR('değil,')}</div>
   <div style="margin-top:18px"><span id="s8b" class="sticker">${TR('sahada.')}</span></div></div>
  <div id="s8l" style="left:0;right:0;bottom:330px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:86">
   <div style="width:260px;height:122px;background:url(assets/logo_white.png) center/contain no-repeat;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))"></div>
   <div style="font:800 32px/1 Inter;text-shadow:0 2px 10px rgba(0,0,0,.6)">@think2actorg · think2act.org</div></div>
  ${pill('Konya','cityTop',86,'s8c')}`);

html.push('<div id="logo"></div><div id="vig"></div><div id="grain"></div><div id="prog"><i></i></div>');
root.innerHTML = html.join('');

/* ---------------- timeline ---------------- */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = { autoAlpha: 0, scale: 1.06 }, INto = { autoAlpha: 1, scale: 1, duration: 0.22, ease: 'power2.out' };
const textIn = (sel, t, d = 0.35) => tl.fromTo(sel, { y: 22, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: d, ease: 'power3.out', immediateRender: false }, t);
const pop = (sel, t) => tl.fromTo(sel, { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: 'back.out(2.2)', immediateRender: false }, t);
const push = (sel, t0, t1, a = 1, b = 1.07) => tl.fromTo(sel, { scale: a }, { scale: b, duration: t1 - t0, ease: 'none', immediateRender: false }, t0);
const swap = (outSel, inSel, t) => { tl.set(outSel, { autoAlpha: 0 }, t); tl.fromTo(inSel, { autoAlpha: 0, x: 24 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, t); };
const count = (sel, to, t0, t1) => { const o = { v: 0 }; tl.to(o, { v: to, duration: t1 - t0, ease: 'power2.out', onUpdate: () => { document.querySelector(sel).textContent = nf(o.v); } }, t0); };

// global
tl.to('#prog i', { scaleX: 1, duration: T.duration, ease: 'none' }, 0);
for (let i = 0; i < T.duration * 12; i++) tl.set('#grain', { x: ((i * 73) % 150) - 75, y: ((i * 131) % 150) - 75 }, i / 12);

// s1 hook
push('#s1bg', 0, B('s1', 4) + OV, 1, 1.07);
textIn('#s1a', 0.15);
gsap.set('#s1b', { autoAlpha: 0 }); pop('#s1b', B('s1', 4));
gsap.set('#s1p2', { autoAlpha: 0 }); swap('#s1p1', '#s1p2', B('s1', 4));
tl.fromTo('#v1', IN, { ...INto, immediateRender: false }, B('s1', 4));

// s2 map
tl.fromTo('#s2', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.22, ease: 'power2.out', immediateRender: false }, B('s2'));
textIn('#s2t', B('s2', 1));
gsap.set('#s2k', { autoAlpha: 0 }); pop('#s2k', B('s2', 2));
push('#s2map svg', B('s2'), B('s2', 12) + OV, 1, 1.05);
gsap.set('.pin', { autoAlpha: 0, scale: 0.4 });
tl.to('#rK', { strokeDashoffset: 0, duration: 2.0, ease: 'power2.inOut' }, B('s2', 2.6));
tl.to('#rE', { strokeDashoffset: 0, duration: 1.6, ease: 'power2.inOut' }, B('s2', 5.6));
for (let i = 0; i < 5; i++) tl.to(`#pin${i}`, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, B('s2', 3 + i * 0.5));
for (let i = 0; i < 4; i++) tl.to(`#pin${5 + i}`, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, B('s2', 6 + i * 0.5));
textIn('#s2leg', B('s2', 8));

// s3 counter
tl.fromTo('#s3bg', IN, { ...INto, immediateRender: false }, B('s3'));
push('#s3bg', B('s3') + 0.22, B('s3', 8) + OV, 1, 1.05);
textIn('#s3b', B('s3', 0.4));
count('#n3', 4507, B('s3', 0.6), B('s3', 3.6));
pop('#s3p', B('s3', 1));

// s4 Karadeniz
tl.fromTo('#v4', IN, { ...INto, immediateRender: false }, B('s4'));
gsap.set(['#s4bg2', '#s4tir'], { autoAlpha: 0 });
tl.fromTo('#s4p1', { y: -320, rotation: -14, autoAlpha: 0 }, { y: 0, rotation: -5, autoAlpha: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, B('s4', 1));
tl.fromTo('#s4p2', { y: -320, rotation: 12, autoAlpha: 0 }, { y: 0, rotation: 4, autoAlpha: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, B('s4', 2));
textIn('#s4b', B('s4', 0.5));
count('#s4n', 2304, B('s4', 1), B('s4', 3.5));
tl.fromTo('.s4pl', { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, stagger: 0.08, ease: 'power3.out', immediateRender: false }, B('s4', 2));
pop('#s4c1', B('s4', 0.5));
tl.to(['#s4p1', '#s4p2'], { x: -1200, rotation: -20, duration: 0.4, ease: 'power2.in' }, B('s4', 5) - 0.3);
tl.to('#s4c1', { autoAlpha: 0, duration: 0.15 }, B('s4', 5));
tl.fromTo('#s4bg2', IN, { ...INto, immediateRender: false }, B('s4', 5));
push('#s4bg2', B('s4', 5) + 0.22, B('s4', 10) + OV, 1, 1.05);
textIn('#s4tir', B('s4', 5.5));

// s5 Ege
tl.fromTo('#v5', IN, { ...INto, immediateRender: false }, B('s5'));
gsap.set(['#s5bg2', '#s5c2'], { autoAlpha: 0 });
tl.fromTo('#s5p1', { y: -320, rotation: 14, autoAlpha: 0 }, { y: 0, rotation: 5, autoAlpha: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, B('s5', 1));
tl.fromTo('#s5p2', { y: -320, rotation: -12, autoAlpha: 0 }, { y: 0, rotation: -4, autoAlpha: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, B('s5', 2));
textIn('#s5b', B('s5', 0.5));
count('#s5n', 2203, B('s5', 1), B('s5', 3.5));
tl.fromTo('.s5pl', { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, stagger: 0.08, ease: 'power3.out', immediateRender: false }, B('s5', 2));
pop('#s5c1', B('s5', 0.5));
tl.to(['#s5p1', '#s5p2'], { x: 1200, rotation: 20, duration: 0.4, ease: 'power2.in' }, B('s5', 5) - 0.3);
tl.fromTo('#s5bg2', IN, { ...INto, immediateRender: false }, B('s5', 5));
push('#s5bg2', B('s5', 5) + 0.22, B('s5', 10) + OV, 1, 1.05);
swap('#s5c1', '#s5c2', B('s5', 5));

// s6 robot futbolu
tl.fromTo('#s6bg', IN, { ...INto, immediateRender: false }, B('s6'));
push('#s6bg', B('s6') + 0.22, B('s6', 6) + OV, 1, 1.06);
tl.fromTo('#s6a', { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, B('s6', 1));
gsap.set('#s6b', { autoAlpha: 0 }); pop('#s6b', B('s6', 2));
gsap.set('#s6c2', { autoAlpha: 0 }); pop('#s6c1', B('s6', 1)); swap('#s6c1', '#s6c2', B('s6', 6));
tl.fromTo('#v6', IN, { ...INto, immediateRender: false }, B('s6', 6));

// s7 peak
