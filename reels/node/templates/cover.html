<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #bg {
        position: absolute; inset: 0;
        background: url("{{IMAGE}}") center / cover no-repeat;
      }
      #shade {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 62%, rgba(0,0,0,0.9) 100%);
      }
      #title {
        position: absolute; left: 80px; right: 80px; bottom: 300px;
        font-family: "Montserrat", "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -0.03em;
        color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,0.5);
        overflow-wrap: anywhere;
      }
      #title em { font-style: normal; color: {{ACCENT}}; }
      #tag {
        position: absolute; left: 80px; bottom: 200px;
        font: 700 40px/1 "Montserrat", "Inter", Arial, sans-serif;
        color: rgba(255,255,255,0.85); letter-spacing: 0.08em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="shade"></div>
    <div id="title">{{TITLE}}</div>
    <div id="tag">{{TAG}}</div>
  </body>
</html>
