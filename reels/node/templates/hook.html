<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      :root {
        --card: #ffffff;
        --ink: #0b0b0f;
        --accent: {{ACCENT}};
        --font-display: "Montserrat", "Inter", "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #hook {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 260px;
        display: flex;
        justify-content: center;
      }
      #card {
        position: relative;
        background: var(--card);
        color: var(--ink);
        border-radius: 28px;
        padding: 34px 44px 38px;
        font-size: 64px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      #bar {
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 16px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: left center;
      }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <div id="hook" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
        <div id="card">{{WORDS}}<div id="bar"></div></div>
      </div>
    </div>
    <script>
      const D = {{DURATION}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { y: -60, scale: 0.85, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo("#card .w", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, stagger: 0.06, ease: "power3.out" }, 0.12);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: D - 0.6, ease: "none" }, 0.3);
      tl.to("#card", { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, D - 0.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
